<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stone Clicker</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <div id="console">
    <p class="old-msg">. Welcome to Stone Clicker</p>
    <p id="message-area">&gt; Ready to mine stones|</p>
  </div>
   <!--Fick hjälp med med konsolen av AI så jag kan få den där konsolen visas-->
  <div id="game">
    <h1>Stones: <span id="score">0</span></h1>

    <button id="click-target">Make Stone</button>

    <div id="stats">
      <h2>Mining Stats</h2>
      <hr>
      <p>Stones per click: <span id="points-per-click">1</span></p>
    </div>
  </div>

</body>
</html>
